      });

      html += '<button type="submit" class="btn">បញ្ជូនចម្លើយ (Submit)</button>';
      html += '</form>';

      document.getElementById('app').innerHTML = html;
      startTimer();
    }

    function startTimer() {
      var display = document.getElementById('timerDisplay');
      timerInterval = setInterval(function() {
        var minutes = Math.floor(timeLeft / 60);
        var seconds = timeLeft % 60;
        display.innerHTML = (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (!isSubmitted) {
            alert("អស់រយៈពេល ១០នាទីហើយ ប្រព័ន្ធនឹងធ្វើការបញ្ជូនចម្លើយរបស់អ្នកស្វ័យប្រវត្តិ។");
            processSubmission();
          }
        }
        timeLeft--;
      }, 1000);
    }

    function manualSubmit(event) {
      if(event) event.preventDefault();
      if(confirm("តើអ្នកពិតជាចង់បញ្ជូនចម្លើយមែនទេ?")) {
        clearInterval(timerInterval);
        processSubmission();
      }
    }

    function processSubmission() {
      if (isSubmitted) return;
      isSubmitted = true;

      var score = 0;
      activeQuestions.forEach(function(item, index) {
        var selected = document.querySelector('input[name="q_' + index + '"]:checked');
        if (selected && selected.value.trim() === item.correct.trim()) {
          score++;
        }
      });

      var html = '<div style="text-align:center; padding: 40px;">';
      html += '<h2 style="color: #1a73e8;">លទ្ធផលនៃការប្រឡងរបស់អ្នក</h2>';
      html += '<p>អបអរសាទរ! ចម្លើយរបស់អ្នកត្រូវបានកត់ត្រារួចរាល់។</p>';
      html += '<div style="font-size: 40px; font-weight: bold; color: #2e7d32; margin: 20px 0; background: #e6f4ea; padding: 15px; border-radius: 8px;">' + score + ' / ' + activeQuestions.length + '</div>';
      html += '<p style="color: #555; font-size: 16px;">ពិន្ទុសរុបដែលអ្នកទទួលបាន</p>';
      html += '</div>';
      
      document.getElementById('app').innerHTML = html;
    }
  </script>
</body>
</html>
